name: Deploy to Cloud Run

env:
  SERVICE_NAME: cerebrum
  PROJECT_ID: fourth-return-426414-q6
  DOCKER_IMAGE_URL: us-east1-docker.pkg.dev/fourth-return-426414-q6/cerebrum/image
  REGION: us-east1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dockerize-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Google Cloud Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          install_components: 'beta'

      # - name: Google Secret Manager
      #   uses: 'google-github-actions/get-secretmanager-secrets@v2'
      #   with:
      #     secrets: |-
      #       COMPOSIO_API_KEY:${{ env.PROJECT_ID }}/COMPOSIO_API_KEY
      #       GITHUB_ACCESS_TOKEN:${{ env.PROJECT_ID }}/GITHUB_ACCESS_TOKEN
      #       JIRA_API_KEY:${{ env.PROJECT_ID }}/JIRA_API_KEY
      #       OPENAI_API_KEY:${{ env.PROJECT_ID }}/OPENAI_API_KEY
      #     export_to_environment: true  

      - name: Get secret from Secret Manager
        id: get_secret
        run: |

          echo "COMPOSIO_API_KEY=${{ secrets.COMPOSIO_API_KEY }}" >> .env
          echo "GITHUB_ACCESS_TOKEN=${{ secrets.GB_ACCESS_TOKEN }}" >> .env
          echo "JIRA_API_KEY=${{ secrets.JIRA_API_KEY}}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env                          
          # cat .env  # For debugging purposes

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_URL }}:latest -f Dockerfile .
          docker push ${{ env.DOCKER_IMAGE_URL }}:latest

      - name: Deploy to Cloud Run
        run: |
          # echo SERVICE_NAME ${{ env.SERVICE_NAME }}
          # gcloud beta run deploy ${{ env.SERVICE_NAME }} \
          #   --image ${{ env.DOCKER_IMAGE_URL }}:latest \
          #   --platform managed \
          #   --region ${{ env.REGION }} \
          #   --allow-unauthenticated \
          #   --execution-environment gen2 \ 
          #   --add-volume-mount=volume=data,mount-path=/app/data \
          #   --add-volume=name=data,type=cloud-storage,bucket=cerebrum-data-01

          gcloud beta run deploy cerebrum \
            --image  us-east1-docker.pkg.dev/fourth-return-426414-q6/cerebrum/image:latest \
            --platform managed \
            --region us-east1 \
            --execution-environment gen2
            --allow-unauthenticated \
            --add-volume=name=data,type=cloud-storage,bucket=cerebrum-data-01 \
            --add-volume-mount=volume=data,mount-path='/app/data'
