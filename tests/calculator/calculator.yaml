---
openapi: 3.1.0
info:
  title: FastAPI calculator
  version: 0.1.0
  description: this api set provides four basic mathematical operation with two arguments, and number limitation as of Number in Python
servers:
  - url: http://localhost:10101
paths:
  "/add":
    post:
      summary: Add
      operationId: add_post
      description: add two numbers and return the result
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Operation"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/subtract":
    post:
      summary: Subtract
      operationId: subtract_post
      description: subtract two numbers and return the result
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Operation"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/multiply":
    post:
      summary: Multiply
      operationId: multiply_post
      description: multiply two numbers and return the result
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Operation"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/divide":
    post:
      summary: Divide
      operationId: divide_post
      description: divide two numbers and return the result
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Operation"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            "$ref": "#/components/schemas/ValidationError"
    Operation:
      title: Operation
      description: Operation represents the two operands give to the calculator to perform the operation, one of the four basic mathematical operations
      required:
        - num1
        - num2
      type: object
      properties:
        num1:
          title: Num1
          type: number
          description: first operand that will be on the left side of the operator
        num2:
          title: Num2
          type: number
          description: second operand that will be on the right side of the operator, in division, this number should not be zero, in case or zero and internal server error will be returned

    ValidationError:
      title: ValidationError
      required:
        - loc
        - msg
        - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
