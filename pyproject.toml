[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebrum"
version = "1.0.0"
description = "A self-modifying AI framework"
requires-python = ">=3.8"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]

[tool.hatch.build]
include = [
    "cerebrum/**/*.py",
    "cerebrum/py.typed",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
