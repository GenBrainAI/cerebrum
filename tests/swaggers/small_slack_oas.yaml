openapi: 3.0.1
info:
  title: Slack Web API
  description: >-
    One way to interact with the Slack platform is its HTTP RPC-based Web API, a
    collection of methods requiring OAuth 2.0-based user, bot, or workspace
    tokens blessed with related OAuth scopes.
  contact:
    name: Slack developer relations
    url: https://api.slack.com/support
  version: 1.7.0
externalDocs:
  description: Learn more about the Slack Web API
  url: https://api.slack.com/web
servers:
  - url: https://slack.com/api
tags: [ ]
paths:
  /admin.users.list:
    get:
      tags:
        - admin.users
        - admin
      description: List users on a workspace
      externalDocs:
        description: API method documentation
        url: https://api.slack.com/methods/admin.users.list
      operationId: admin_users_list
      parameters:
        - name: token
          in: header
          description: 'Authentication token. Requires scope: `admin.users:read`'
          required: true
          schema:
            type: string
        - name: team_id
          in: query
          description: The ID (`T1234`) of the workspace.
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          description: >-
            Set `cursor` to `next_cursor` returned by the previous call to list
            items in the next page.
          schema:
            type: string
        - name: limit
          in: query
          description: Limit for how many users to be retrieved per page
          schema:
            type: integer
      responses:
        '200':
          description: Typical success response
          content:
            application/json:
              schema:
                title: Default success template
                type: object
                additionalProperties:
                  type: object
                description: >-
                  This method either only returns a brief _OK_ response or a
                  verbose schema is not available for this method.
              example:
                ok: true
                users:
                  - email: bront@slack.com
                    id: T1234
                    is_admin: false
                    is_bot: false
                    is_owner: false
                    is_primary_owner: false
                    is_restricted: false
                    is_ultra_restricted: false
        default:
          description: Typical error response
          content:
            application/json:
              schema:
                title: Default error template
                type: object
                additionalProperties:
                  type: object
                description: >-
                  This method either only returns a brief _not OK_ response or a
                  verbose schema is not available for this method.
              example:
                error: invalid_auth
                ok: false
      security:
        - slackAuth:
            - admin.users:read
  /users.list:
    get:
      tags:
        - users
      description: Lists all users in a Slack team.
      externalDocs:
        description: API method documentation
        url: https://api.slack.com/methods/users.list
      operationId: users_list
      parameters:
        - name: token
          in: query
          description: 'Authentication token. Requires scope: `users:read`'
          schema:
            type: string
        - name: limit
          in: query
          description: >-
            The maximum number of items to return. Fewer than the requested
            number of items may be returned, even if the end of the users list
            hasn't been reached. Providing no `limit` value will result in Slack
            attempting to deliver you the entire result set. If the collection
            is too large you may experience `limit_required` or HTTP 500 errors.
          schema:
            type: integer
        - name: cursor
          in: query
          description: >-
            Paginate through collections of data by setting the `cursor`
            parameter to a `next_cursor` attribute returned by a previous
            request's `response_metadata`. Default value fetches the first
            "page" of the collection. See [pagination](/docs/pagination) for
            more detail.
          schema:
            type: string
        - name: include_locale
          in: query
          description: >-
            Set this to `true` to receive the locale for users. Defaults to
            `false`
          schema:
            type: boolean
      responses:
        '200':
          description: Typical success response
          content:
            application/json:
              schema:
                title: users.list schema
                type: object
                additionalProperties:
                  type: object
                description: Schema for successful response from users.list method
              example:
                cache_ts: 1498777272
                members:
                  - color: 9f69e7
                    deleted: false
                    has_2fa: false
                    id: W012A3CDE
                    is_admin: true
                    is_app_user: false
                    is_bot: false
                    is_owner: false
                    is_primary_owner: false
                    is_restricted: false
                    is_ultra_restricted: false
                    name: spengler
                    profile:
                      avatar_hash: ge3b51ca72de
