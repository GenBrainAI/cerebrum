openapi: 3.1.0
info:
  title: Complex Number Calculator API
  version: 1.0.0
  description: A FastAPI calculator for complex number operations
servers:
  - url: http://example_complex_calculator.com
paths:
  /complex/add:
    post:
      operationId: postComplexadd
      summary: Add two complex numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplexOperation'
      responses:
        '200':
          description: Successful addition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplexResult'
  /complex/subtract:
    post:
      operationId: postComplexsubtract
      summary: Subtract two complex numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplexOperation'
      responses:
        '200':
          description: Successful subtraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplexResult'
  /complex/multiply:
    post:
      operationId: postComplexmultiply
      summary: Multiply two complex numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplexOperation'
      responses:
        '200':
          description: Successful multiplication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplexResult'
  /complex/divide:
    post:
      operationId: postComplexdivide
      summary: Divide two complex numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplexOperation'
      responses:
        '200':
          description: Successful division
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplexResult'
components:
  schemas:
    ComplexNumber:
      type: object
      properties:
        real:
          type: number
          format: float
          description: The real part of the complex number
        imag:
          type: number
          format: float
          description: The imaginary part of the complex number
      required:
        - real
        - imag
    ComplexOperation:
      type: object
      properties:
        num1:
          $ref: '#/components/schemas/ComplexNumber'
        num2:
          $ref: '#/components/schemas/ComplexNumber'
      required:
        - num1
        - num2
    ComplexResult:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/ComplexNumber'
      required:
        - result
