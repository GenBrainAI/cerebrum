name: Deploy to Cloud Run

env:
  SERVICE_NAME: cerebrum
  PROJECT_ID: fourth-return-426414-q6
  DOCKER_IMAGE_URL: us-east1-docker.pkg.dev/fourth-return-426414-q6/cerebrum/image
  REGION: us-east1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dockerize-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Google Cloud Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      # - name: Google Secret Manager
      #   uses: 'google-github-actions/get-secretmanager-secrets@v2'
      #   with:
      #     secrets: |-
      #       COMPOSIO_API_KEY:${{ env.PROJECT_ID }}/COMPOSIO_API_KEY
      #       GITHUB_ACCESS_TOKEN:${{ env.PROJECT_ID }}/GITHUB_ACCESS_TOKEN
      #       JIRA_API_KEY:${{ env.PROJECT_ID }}/JIRA_API_KEY
      #       OPENAI_API_KEY:${{ env.PROJECT_ID }}/OPENAI_API_KEY
      #     export_to_environment: true  

      - name: Get secret from Secret Manager
        id: get_secret
        run: |
          gcloud secrets versions access latest --secret=COMPOSIO_API_KEY --project=${{ env.PROJECT_ID }}
          echo "::set-output name=secret_value::$(cat /tmp/secret_value1)"
          gcloud secrets versions access latest --secret=GITHUB_ACCESS_TOKEN --project=${{ env.PROJECT_ID }}
          echo "::set-output name=secret_value::$(cat /tmp/secret_value2)"
          gcloud secrets versions access latest --secret=JIRA_API_KEY --project=${{ env.PROJECT_ID }}
          echo "::set-output name=secret_value::$(cat /tmp/secret_value3)"
          gcloud secrets versions access latest --secret=OPENAI_API_KEY --project=${{ env.PROJECT_ID }}
          echo "::set-output name=secret_value::$(cat /tmp/secret_value4)"

      - name: Update environment file
        run: |
          echo "SECRET_KEY=${{ steps.get_secret.outputs.secret_value1 }}" >> .env  # Adjust as per your environment file format
          echo "SECRET_KEY=${{ steps.get_secret.outputs.secret_value2 }}" >> .env  # Adjust as per your environment file format
          echo "SECRET_KEY=${{ steps.get_secret.outputs.secret_value3 }}" >> .env  # Adjust as per your environment file format
          echo "SECRET_KEY=${{ steps.get_secret.outputs.secret_value4 }}" >> .env  # Adjust as per your environment file format
          cat .env  # For debugging purposes
    

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_URL }}:latest -f Dockerfile .
          docker push ${{ env.DOCKER_IMAGE_URL }}:latest

      - name: Deploy to Cloud Run
        run: |
          echo SERVICE_NAME $SERVICE_NAME
          gcloud run deploy $SERVICE_NAME \
            --image ${{ env.DOCKER_IMAGE_URL }}:latest \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated