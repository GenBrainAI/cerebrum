openapi: 3.0.0
info:
  title: Complex Number Calculator API
  version: 1.0.0
servers:
  - url: http://example_complex_calculator.com
paths:  
  /complex/power:
    post:
      summary: Calculate the power of a complex number
      operationId: complexPower
      tags:
        - Complex Number Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base:
                  type: object
                  properties:
                    real:
                      type: number
                    imag:
                      type: number
                exponent:
                  type: number
      responses:
        '200':
          description: Result of the exponentiation
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      real:
                        type: number
                      imag:
                        type: number

